<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12352f" />
    <meta name="description" content="Academic portfolio of Yihang Liu." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Yihang Liu | Spatial Intelligence & 3D Vision" />
    <meta property="og:description" content="Geospatial information engineering, panoramic depth estimation, 3D reconstruction, and urban spatial analysis." />
    <meta property="og:image" content="./assets/profile.jpg" />
    <title>Yihang Liu | Spatial Intelligence & 3D Vision</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./content.js" defer></script>
    <script src="./script.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="wordmark" href="#top" aria-label="Yihang Liu home">
        <span class="wordmark-mark">YL</span>
        <span class="wordmark-name">Yihang Liu</span>
      </a>
      <nav class="nav" id="nav" aria-label="Primary navigation"></nav>
      <button class="language-button" id="language-button" type="button" aria-label="Switch language">中文</button>
    </header>

    <main id="main">
      <section class="hero section-pad" id="top">
        <div class="hero-copy" data-reveal>
          <p class="eyebrow" id="hero-eyebrow"></p>
          <h1 id="hero-title"></h1>
          <p class="hero-intro" id="hero-intro"></p>
          <div class="hero-actions">
            <a class="button button-primary" href="#research" id="hero-primary"></a>
            <a class="button button-quiet" id="hero-secondary"></a>
          </div>
          <p class="availability"><span aria-hidden="true"></span><b id="hero-status"></b></p>
        </div>

        <div class="portrait-wrap" data-reveal>
          <div class="coordinate coordinate-a">22.5431° N</div>
          <div class="coordinate coordinate-b">114.0579° E</div>
          <div class="portrait-frame">
            <img id="profile-photo" alt="Portrait of Yihang Liu" width="466" height="620" />
          </div>
          <div class="portrait-caption">
            <strong id="portrait-name"></strong>
            <span id="portrait-location"></span>
          </div>
        </div>
      </section>

      <section class="fact-strip" id="facts" aria-label="Profile highlights"></section>

      <section class="content-section section-pad" id="about">
        <div class="section-heading" data-reveal>
          <p class="section-label" id="about-label"></p>
          <h2 id="about-title"></h2>
        </div>
        <div class="about-grid">
          <div class="about-copy" id="about-copy" data-reveal></div>
          <div class="interest-list" id="interest-list" data-reveal></div>
        </div>
      </section>

      <section class="content-section research-section section-pad" id="research">
        <div class="section-heading" data-reveal>
          <p class="section-label" id="research-label"></p>
          <h2 id="research-title"></h2>
        </div>
        <div class="research-list" id="research-list"></div>
      </section>

      <section class="content-section section-pad" id="experience">
        <div class="section-heading" data-reveal>
          <p class="section-label" id="experience-label"></p>
          <h2 id="experience-title"></h2>
        </div>
        <div class="timeline" id="experience-list"></div>
      </section>

      <section class="content-section highlights-section section-pad" id="highlights">
        <div class="section-heading" data-reveal>
          <p class="section-label" id="highlights-label"></p>
          <h2 id="highlights-title"></h2>
        </div>
        <div class="highlights-grid">
          <article class="highlight-panel" data-reveal>
            <h3 id="awards-title"></h3>
            <ol class="award-list" id="award-list"></ol>
          </article>
          <article class="highlight-panel code-panel" data-reveal>
            <h3 id="code-title"></h3>
            <div class="repo-list" id="repo-list"></div>
          </article>
        </div>
      </section>

      <section class="contact section-pad" id="contact">
        <div class="contact-copy" data-reveal>
          <p class="section-label light" id="contact-label"></p>
          <h2 id="contact-title"></h2>
          <p id="contact-text"></p>
        </div>
        <div class="contact-actions" data-reveal>
          <a class="button button-light" id="contact-email"></a>
          <div class="social-links" id="social-links"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>© <span id="year"></span> <span id="footer-name"></span></p>
      <p id="footer-copy"></p>
      <a href="./admin/" aria-label="Open content management guide">Manage content ↗</a>
    </footer>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Academic homepage of Yihang Liu." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Yihang Liu | Academic Homepage" />
    <meta property="og:description" content="Research in geospatial information engineering, 3D vision, and spatial intelligence." />
    <meta property="og:image" content="./assets/profile.jpg" />
    <title>Yihang Liu | Academic Homepage</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=3" />
    <script src="./content.js?v=3" defer></script>
    <script src="./script.js?v=3" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="header-inner">
        <a class="site-name" href="#home">Yihang Liu</a>
        <nav class="site-nav" id="site-nav" aria-label="Primary navigation"></nav>
        <button class="language-button" id="language-button" type="button" aria-label="Switch language">中文</button>
      </div>
    </header>

    <main class="page" id="main">
      <section class="profile" id="home">
        <div class="profile-copy">
          <p class="role" id="profile-role"></p>
          <h1 id="profile-name"></h1>
          <p class="profile-intro" id="profile-intro"></p>
          <div class="profile-links" id="profile-links"></div>
        </div>
        <figure class="profile-photo">
          <img id="profile-image" width="233" height="310" alt="Portrait of Yihang Liu" />
          <figcaption id="profile-location"></figcaption>
        </figure>
      </section>

      <section class="section overview-grid" id="about">
        <article>
          <h2 id="about-heading"></h2>
          <div class="body-copy" id="about-copy"></div>
          <p class="interest-line" id="interest-line"></p>
        </article>
        <article>
          <h2 id="education-heading"></h2>
          <h3 id="education-school"></h3>
          <p id="education-degree"></p>
          <p id="education-unit"></p>
          <p class="education-details" id="education-details"></p>
          <p id="education-coursework"></p>
        </article>
      </section>

      <section class="section" id="research">
        <div class="section-title-row">
          <h2 id="research-heading"></h2>
          <span id="research-note"></span>
        </div>
        <div class="entry-list" id="research-list"></div>
      </section>

      <section class="section columns" id="experience">
        <article>
          <h2 id="experience-heading"></h2>
          <div class="compact-list" id="experience-list"></div>
        </article>
        <article>
          <h2 id="awards-heading"></h2>
          <ul class="plain-list" id="awards-list"></ul>
        </article>
      </section>

      <section class="section compact-bottom">
        <article>
          <h2 id="code-heading"></h2>
          <div class="inline-links" id="repository-list"></div>
        </article>
        <article id="contact">
          <h2 id="contact-heading"></h2>
          <p id="contact-copy"></p>
          <a class="email-link" id="contact-email"></a>
        </article>
      </section>
    </main>

    <footer class="site-footer">
      <div>
        <span>© <span id="year"></span> Yihang Liu</span>
        <a href="./admin/">Manage content</a>
      </div>
    </footer>
  </body>
</html>
